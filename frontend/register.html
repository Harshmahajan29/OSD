<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Registration | Open Source Day 2026 | WLUG</title>
    <meta
      name="description"
      content="Register for WLUG Open Source Day 2026. Taking place Sunday, 25 October 2026 at Walchand College of Engineering, Sangli."
    />
    <meta name="theme-color" content="#160c28" />
    <meta http-equiv="refresh" content="0; url=/index.html#registration" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />

    <script>
      // Seamlessly redirect to the inline registration section on the Home page
      if (typeof window !== 'undefined') {
        window.location.replace('/#registration');
      }
    </script>

    <style>
      .redirect-wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .redirect-card {
        max-width: 480px;
        width: 100%;
        padding: 40px 32px;
        border-radius: 24px;
        background: linear-gradient(175deg, rgb(36 21 64 / 0.85) 0%, rgb(22 12, 40 / 0.95) 100%);
        border: 1.5px solid rgb(138 77 255 / 0.35);
        box-shadow: 0 20px 50px rgb(5 0 15 / 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .redirect-card h1 {
        font-family: var(--font-display, inherit);
        font-size: 2rem;
        margin-bottom: 12px;
        color: var(--c-text-warm);
      }
      .redirect-card p {
        color: var(--c-text-muted);
        font-size: 1.0625rem;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .redirect-card .btn {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="redirect-wrap">
      <div class="redirect-card">
        <h1>Entering the Realm...</h1>
        <p>The registration form has moved directly to the Open Source Day 2026 home page.</p>
        <a class="btn btn--primary btn--lg" href="/index.html#registration">Go to Registration</a>
      </div>
    </div>
  </body>
</html>
